<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#62442f"><title>みんなの本棚 Ver.0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5efe6;color:#3a2a20;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header,main,nav{max-width:820px;margin:auto}header{padding:28px 18px 8px}h1{margin:6px 0;font-size:28px}h2{font-size:21px}p{line-height:1.7}.muted,.note{color:#756050;font-size:13px}.tabs{display:flex;gap:8px;padding:18px 14px}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;min-height:44px}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #277c91;outline-offset:3px}.tab{flex:1;border:1px solid #b69a80;background:#fffaf4;border-radius:25px;padding:12px 3px;font-size:13px;color:#684b39}.tab[aria-pressed=true],.primary{background:#62442f;color:white}main{padding:0 14px max(32px,env(safe-area-inset-bottom))}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.primary,.secondary{border:1px solid #96765c;border-radius:12px;padding:10px 16px}.secondary{background:#fffaf3;color:#62442f}.case{border:12px solid #8c5a35;border-radius:9px;padding:14px 10px 20px;background:repeating-linear-gradient(93deg,#ffffff05 0 2px,#5930140b 3px 5px,transparent 6px 31px),linear-gradient(90deg,#b67d47,#e0b47a,#b67d47);box-shadow:0 14px 24px #3b24152c,inset 0 0 14px #56361a66}.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:12px;padding:18px 6px 8px;min-height:188px;background:linear-gradient(#59391c45,transparent 40%),repeating-linear-gradient(2deg,#d8a774 0 3px,#dbaf80 4px 7px,#e1b786 8px 21px);border-bottom:15px solid #8b572f;box-shadow:0 7px 0 #60391f,inset 0 -7px 8px #75432144}.shelf+.shelf{margin-top:18px}.book{border:0;background:transparent;padding:0;min-width:0;display:flex;justify-content:center;position:relative}.cover{width:min(100%,132px);aspect-ratio:.7;background:#466a6a;color:#fff8e7;box-shadow:3px 4px 7px #24150975;border-left:5px solid #0002;border-radius:2px 4px 4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:7px;position:relative;overflow:hidden}.cover strong{font-size:clamp(12px,3vw,18px);overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}.cover small{font-size:10px;overflow-wrap:anywhere}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#eee4d5}.star{position:absolute;right:0;top:0;background:#fff5c0;color:#68430a;padding:3px 6px;border-radius:50%;font-size:16px}.empty{grid-column:1/-1;text-align:center;color:#65472f;font-size:13px;line-height:1.8;padding:16px 0}.note{text-align:center;line-height:1.8;margin:24px 0 0}dialog{border:1px solid #d4c2ad;border-radius:18px;padding:22px;width:min(94vw,620px);max-height:88vh;max-height:88dvh;overflow:auto;background:#fffaf3;color:#3a2a20}dialog::backdrop{background:#1d120b99}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-head h2{margin:0}.fields{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select{border:1px solid #a98d74;border-radius:8px;background:white;color:#3a2a20;min-height:44px;padding:9px;font-size:16px;max-width:100%}input[type=search]{width:100%;min-width:0}.query{flex:1;min-width:180px}label{font-size:14px;line-height:1.7}#results{display:grid;gap:10px;margin:12px 0}.result{display:flex;gap:12px;align-items:center;border:1px solid #d7c7b5;border-radius:10px;padding:10px;min-width:0}.result:has(input:checked){background:#eee5d5;border-color:#62442f}.result input{flex:none;width:23px;height:23px}.result .cover{flex:none;width:58px;min-height:82px}.result .cover strong{font-size:10px}.result .cover small{display:none}.result-info{min-width:0;overflow-wrap:anywhere}.result-info strong{display:block}.result-info small{color:#756050}.register{position:sticky;bottom:-22px;background:#fffaf3;padding:12px 0;box-shadow:0 -5px 10px #fffaf3;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#notice{min-height:24px;font-size:14px;line-height:1.7}#search-message{line-height:1.7;font-size:14px}#detail-actions{display:grid;gap:12px;margin:20px 0}.danger{color:#9b3022}.check{display:flex;gap:10px;align-items:center}.check input{width:22px;height:22px;min-height:22px}#detail-description{white-space:pre-wrap;overflow-wrap:anywhere}#storage-error{padding:12px;background:#fff0d9;border:1px solid #ad6c23;border-radius:10px}#storage-error[hidden]{display:none}@media(min-width:620px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr));min-height:235px;padding:22px 12px 8px}.cover strong{font-size:18px}}@media(max-width:360px){.case{border-width:8px;padding:10px 5px 18px}.shelf{gap:8px;padding-inline:3px;min-height:165px}h1{font-size:25px}}
</style>
</head>
<body>
<header><div class="muted">MY LITTLE LIBRARY · Ver.0.3</div><h1>📚 みんなの本棚</h1><div class="muted">読んだ本から、次の一冊へ。</div></header>
<nav class="tabs" aria-label="本棚の表示切り替え"><button class="tab" data-type="read" aria-pressed="true">読んだ本</button><button class="tab" data-type="want" aria-pressed="false">読みたい本</button><button class="tab" data-type="favorite" aria-pressed="false">お気に入り</button></nav>
<main><div id="storage-error" role="alert" hidden></div><div class="toolbar"><span id="count" class="muted"></span><button class="primary" id="open-search">＋ 本を追加</button></div><div id="notice" role="status" aria-live="polite"></div><div class="case" id="case" aria-label="本棚"></div><p class="note">本をタップして、読書状況やお気に入りを変更できます。<br>本棚はこのブラウザに保存されます。端末間の同期はありません。<br>ブラウザのデータ削除で本棚も消えます。プライベートブラウズは保存に適しません。<br>書籍情報・表紙：Google Books（検索・表紙表示には通信が必要です）</p></main>
<dialog id="search-dialog" aria-labelledby="search-heading"><div class="dialog-head"><h2 id="search-heading">本を探す</h2><button class="secondary" id="close-search">閉じる</button></div><form id="search-form"><div class="fields"><label>検索対象<br><select id="search-kind"><option value="all">タイトル・著者</option><option value="intitle">タイトル</option><option value="inauthor">著者</option></select></label><label class="query">検索キーワード<input id="query" type="search" required maxlength="200" placeholder="書名や著者名" enterkeyhint="search"></label><button class="primary" type="submit">検索</button></div></form><div id="search-message" role="status" aria-live="polite">キーワードを入力して検索してください。</div><div id="results" aria-label="検索結果"></div><button class="secondary" id="more" hidden>さらに表示</button><div class="register"><label>登録先 <select id="destination"><option value="read">読んだ本</option><option value="want">読みたい本</option></select></label><button class="primary" id="register" disabled>選択した本を登録（0冊）</button></div></dialog>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><button class="secondary" id="close-detail">閉じる</button></div><p id="detail-author"></p><p id="detail-description"></p><div id="detail-actions"><label>読書状況 <select id="book-type"><option value="read">読んだ本</option><option value="want">読みたい本</option></select></label><label class="check"><input type="checkbox" id="book-favorite">お気に入り（読んだ本のみ）</label><button class="primary" id="save-detail">変更を保存</button><button class="secondary danger" id="delete-book">本棚から削除</button></div></dialog>
<script>
'use strict';
const KEY='minna-no-hondana.v03';
const $=id=>document.getElementById(id);
let books=[],filter='read',activeId=null,controller=null,requestId=0,offset=0,lastQuery='',hasMore=false;
const selected=new Map(),results=new Map();
function message(text){$('notice').textContent=text}
function storageError(text){$('storage-error').hidden=false;$('storage-error').textContent=text}
function safeImage(value){try{const url=new URL(value);if(!['http:','https:'].includes(url.protocol))return '';url.protocol='https:';return url.href}catch{return ''}}
function validBook(b){return b&&typeof b.id==='string'&&b.id.length>0&&typeof b.title==='string'&&typeof b.author==='string'&&['read','want'].includes(b.type)}
try{const raw=localStorage.getItem(KEY);if(raw!==null){const data=JSON.parse(raw);if(data.version!==3||!Array.isArray(data.books)||!data.books.every(validBook)||new Set(data.books.map(b=>b.id)).size!==data.books.length)throw Error('invalid');books=data.books.map(b=>({...b,image:safeImage(b.image),description:typeof b.description==='string'?b.description:'',favorite:b.type==='read'&&b.favorite===true}))}}catch{storageError('保存データを読み込めませんでした。元のデータを保護するため、変更の保存を停止しています。');}
let readBlocked=!$('storage-error').hidden;
function persist(next){if(readBlocked){message('保存データを読み込めないため変更できません。');return false}try{localStorage.setItem(KEY,JSON.stringify({version:3,books:next}));books=next;$('storage-error').hidden=true;return true}catch{storageError('ブラウザに保存できません。空き容量やブラウザの保存設定を確認してください。変更は保存されていません。');return false}}
function cover(book){const el=document.createElement('span');el.className='cover';const title=document.createElement('strong');title.textContent=book.title;const author=document.createElement('small');author.textContent=book.author;el.append(title,author);const url=safeImage(book.image);if(url){const img=document.createElement('img');img.alt=book.title+' の表紙';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();img.src=url;el.append(img)}return el}
function render(){const list=books.filter(b=>filter==='favorite'?b.type==='read'&&b.favorite:b.type===filter);$('count').textContent=list.length+'冊';$('case').replaceChildren();document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.type===filter)));const cols=matchMedia('(min-width:620px)').matches?4:3;for(let row=0;row<Math.max(2,Math.ceil(list.length/cols));row++){const shelf=document.createElement('section');shelf.className='shelf';const items=list.slice(row*cols,(row+1)*cols);if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=row===0?'まだ本がありません。「＋ 本を追加」から、あなたの本棚をつくりましょう。':'次の一冊を、この棚に。';shelf.append(empty)}for(const b of items){const button=document.createElement('button');button.className='book';button.setAttribute('aria-label',b.title+'の詳細');button.append(cover(b));if(b.favorite){const star=document.createElement('span');star.className='star';star.textContent='★';star.setAttribute('aria-label','お気に入り');button.append(star)}button.onclick=()=>openDetail(b.id);shelf.append(button)}$('case').append(shelf)}}
function openDetail(id){const b=books.find(b=>b.id===id);if(!b)return;activeId=id;$('detail-title').textContent=b.title;$('detail-author').textContent='著者：'+b.author;$('detail-description').textContent=b.description||'説明はありません。';$('book-type').value=b.type;$('book-favorite').checked=b.favorite;syncFavorite();$('detail').showModal()}
function syncFavorite(){const want=$('book-type').value==='want';$('book-favorite').disabled=want;if(want)$('book-favorite').checked=false}
$('book-type').onchange=syncFavorite;
$('save-detail').onclick=()=>{const type=$('book-type').value;if(persist(books.map(b=>b.id===activeId?{...b,type,favorite:type==='read'&&$('book-favorite').checked}:b))){$('detail').close();render();message('変更を保存しました。')}};
$('delete-book').onclick=()=>{if(confirm('この本を本棚から削除しますか？')&&persist(books.filter(b=>b.id!==activeId))){$('detail').close();render();message('本棚から削除しました。')}};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{filter=t.dataset.type;render()});
$('open-search').onclick=()=>{$('destination').value=filter==='want'?'want':'read';$('search-dialog').showModal()};
function cancelSearch(){requestId++;controller?.abort();controller=null;if($('search-message').textContent==='検索中…')$('search-message').textContent='検索を中断しました。もう一度検索できます。';$('more').disabled=false}
$('close-search').onclick=()=>$('search-dialog').close();$('search-dialog').addEventListener('close',cancelSearch);$('close-detail').onclick=()=>$('detail').close();
function updateSelection(){$('register').disabled=selected.size===0;$('register').textContent='選択した本を登録（'+selected.size+'冊）'}
function plainDescription(value){const doc=new DOMParser().parseFromString(typeof value==='string'?value:'','text/html');return doc.body.textContent||''}
function normalize(item){const v=item.volumeInfo||{};return{id:item.id,title:v.title||'タイトル不明',author:Array.isArray(v.authors)?v.authors.join('・'):'著者不明',description:plainDescription(v.description),image:safeImage(v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail),type:'read',favorite:false}}
function appendResult(b){results.set(b.id,b);const label=document.createElement('label');label.className='result';const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label',b.title+'を選択');const exists=books.some(x=>x.id===b.id);check.disabled=exists;check.checked=selected.has(b.id);check.onchange=()=>{if(check.checked)selected.set(b.id,b);else selected.delete(b.id);updateSelection()};const info=document.createElement('span');info.className='result-info';const title=document.createElement('strong');title.textContent=b.title;const author=document.createElement('small');author.textContent=b.author+(exists?' · 登録済み':'');info.append(title,author);label.append(check,cover(b),info);$('results').append(label)}
async function search(more=false){const text=$('query').value.trim();if(!text)return;controller?.abort();const token=++requestId;controller=new AbortController();const currentController=controller;if(!more){offset=0;selected.clear();results.clear();$('results').replaceChildren();updateSelection();const kind=$('search-kind').value;lastQuery=kind==='all'?text:kind+':'+text}const url=new URL('https://www.googleapis.com/books/v1/volumes');url.search=new URLSearchParams({q:lastQuery,startIndex:String(offset),maxResults:'20',printType:'books'});$('search-message').textContent='検索中…';$('more').disabled=true;$('more').hidden=true;let timedOut=false;const timeout=setTimeout(()=>{timedOut=true;currentController.abort()},15000);try{const response=await fetch(url,{signal:currentController.signal});if(!response.ok)throw Error(String(response.status));const data=await response.json();if(token!==requestId)return;const items=Array.isArray(data.items)?data.items:[];for(const item of items){if(typeof item.id!=='string'||!item.id||results.has(item.id))continue;appendResult(normalize(item))}offset+=items.length;hasMore=items.length===20&&offset<Number(data.totalItems||0);$('more').hidden=!hasMore;$('search-message').textContent=results.size?results.size+'件を表示中。複数選んでまとめて登録できます。':'見つかりませんでした。キーワードを変えてお試しください。'}catch(error){if(token!==requestId)return;if(error.name==='AbortError'&&!timedOut)return;$('search-message').textContent=timedOut?'検索がタイムアウトしました。もう一度お試しください。':error.message==='429'?'検索の利用上限に達しました。時間をおいて再度お試しください。':'検索できませんでした。通信状態を確認して再度お試しください。';$('more').hidden=!more}finally{clearTimeout(timeout);if(token===requestId)$('more').disabled=false}}
$('search-form').onsubmit=e=>{e.preventDefault();search()};$('more').onclick=()=>search(true);
$('register').onclick=()=>{const type=$('destination').value;const additions=[...selected.values()].filter(b=>!books.some(x=>x.id===b.id)).map(b=>({...b,type,favorite:false}));if(!additions.length)return;if(persist([...books,...additions])){filter=type;selected.clear();updateSelection();$('search-dialog').close();$('results').replaceChildren();results.clear();$('more').hidden=true;$('search-message').textContent='キーワードを入力して検索してください。';render();message(additions.length+'冊を登録・保存しました。')}};
matchMedia('(min-width:620px)').addEventListener('change',render);render();
</script>
</body></html>
