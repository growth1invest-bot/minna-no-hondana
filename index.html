<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの本棚 Ver.0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efe6;color:#3a2a20;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{max-width:760px;margin:auto;padding:25px 18px 10px}h1{margin:4px 0;font-size:27px}.muted{color:#816c5c;font-size:13px}.tabs{display:flex;gap:8px;padding:18px 14px;max-width:760px;margin:auto}.tab{flex:1;border:1px solid #c8b49e;background:#fffaf4;border-radius:25px;padding:12px 3px;font-size:13px;color:#684b39}.tab.active{background:#62442f;color:white}main{max-width:760px;margin:auto;padding:0 14px 32px}.case{border:12px solid #8c5a35;border-radius:9px;padding:14px 10px 20px;background:linear-gradient(90deg,#c28d56,#e0b47a,#c18a51);box-shadow:0 14px 24px #3b24152c,inset 0 0 14px #56361a44}.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;padding:13px 8px 8px;min-height:185px;background:linear-gradient(#e9c18d,#d9a56f);border-bottom:15px solid #7c4c2b;box-shadow:0 7px 0 #60391f,inset 0 -6px 6px #75432144}.shelf+.shelf{margin-top:14px}.book{border:0;background:transparent;padding:0;min-width:0;display:flex;justify-content:center;cursor:pointer}.cover{width:min(100%,125px);aspect-ratio:.72;box-shadow:3px 4px 7px #24150975;border-left:7px solid #0002;border-radius:2px 4px 4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:7px}.cover strong{font-size:clamp(12px,3.6vw,18px);line-height:1.4;overflow-wrap:anywhere}.cover small{font-size:10px}.empty{grid-column:1/-1;text-align:center;color:#77553c;font-size:12px}dialog{border:0;border-radius:18px;padding:25px;width:min(90vw,400px);background:#fffaf3;color:#3a2a20}dialog::backdrop{background:#1d120b99}dialog p{line-height:1.7}.close{border:0;border-radius:13px;background:#62442f;color:white;padding:13px;width:100%}.note{text-align:center;color:#8b7665;font-size:12px;line-height:1.6;margin:20px 0}@media(min-width:620px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr));min-height:225px}.cover strong{font-size:18px}}</style></head><body><header><div class="muted">MY LITTLE LIBRARY · Ver.0.1</div><h1>📚 わたしの本棚</h1><div class="muted">読んだ本から、次の一冊へ。</div></header><nav class="tabs" aria-label="本棚の表示切り替え"><button class="tab active" data-type="read">読んだ本</button><button class="tab" data-type="want">読みたい本</button><button class="tab" data-type="favorite">お気に入り</button></nav><main><div class="case" id="case"></div><p class="note">本をタップすると詳細を表示します。<br>サンプルデータによる画面試作品です。検索・保存は未実装です。</p></main><dialog id="detail"><h2 id="title"></h2><p id="author"></p><p id="description"></p><button class="close" id="close">本棚に戻る</button></dialog><script>const books=[{title:"嫌われる勇気",author:"岸見一郎・古賀史健",type:"read",favorite:true,bg:"#267a9c",description:"考え方を見直すきっかけになる一冊。"},{title:"7つの習慣",author:"S・R・コヴィー",type:"read",favorite:true,bg:"#344d76",description:"毎日の習慣について考える。"},{title:"エッセンシャル思考",author:"グレッグ・マキューン",type:"read",favorite:false,bg:"#d9c598",fg:"#33271e",description:"大切なことに集中する。"},{title:"人を動かす",author:"D・カーネギー",type:"read",favorite:false,bg:"#a24e40",description:"人との関わり方を考える。"},{title:"夢をかなえるゾウ",author:"水野敬也",type:"read",favorite:true,bg:"#775883",description:"行動する大切さを学ぶ。"},{title:"FACTFULNESS",author:"ハンス・ロスリングほか",type:"want",favorite:false,bg:"#e3c75d",fg:"#272a33",description:"データで世界を知る。"},{title:"Think Clearly",author:"ロルフ・ドベリ",type:"want",favorite:false,bg:"#617e5a",description:"思考を整理するために読みたい。"}];let filter="read";const el=document.getElementById("case"),dialog=document.getElementById("detail");function render(){el.replaceChildren();const list=books.filter(b=>filter==="favorite"?b.favorite:b.type===filter);const cols=matchMedia("(min-width:620px)").matches?4:3;for(let i=0;i<Math.max(2,Math.ceil(list.length/cols));i++){const shelf=document.createElement("section");shelf.className="shelf";const items=list.slice(i*cols,(i+1)*cols);if(!items.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="ここに本が並びます";shelf.append(empty)}for(const b of items){const btn=document.createElement("button");btn.className="book";btn.setAttribute("aria-label",b.title+"の詳細");const cover=document.createElement("span");cover.className="cover";cover.style.background=b.bg;cover.style.color=b.fg||"white";const title=document.createElement("strong");title.textContent=b.title;const author=document.createElement("small");author.textContent=b.author;cover.append(title,author);btn.append(cover);btn.onclick=()=>{document.getElementById("title").textContent=b.title;document.getElementById("author").textContent="著者："+b.author;document.getElementById("description").textContent=b.description;dialog.showModal()};shelf.append(btn)}el.append(shelf)}}document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{filter=btn.dataset.type;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===btn));render()});document.getElementById("close").onclick=()=>dialog.close();addEventListener("resize",render);render();</script></body></html>
